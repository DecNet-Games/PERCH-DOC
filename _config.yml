# PERCH Documentation Configuration
title: "PERCH Documentation"
description: "High-performance creature landing, perching, and flight coordination framework for Unity."
url: "https://decnet-games.github.io"
baseurl: "/PERCH-DOC"

# Theme setup (supports GitHub Actions builder and remote-theme fallback)
theme: "just-the-docs"
remote_theme: "just-the-docs/just-the-docs"

plugins:
  - jekyll-remote-theme

# Navigation & Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true

# Header / Aux links
aux_links:
  "Unity Asset Store": "https://assetstore.unity.com/"
  "DecNet Games GitHub": "https://github.com/DecNet-Games"

heading_anchors: true

# Color scheme & UI
color_scheme: "dark"

# Callouts
callouts:
  note:
    title: "Note"
    color: "blue"
  tip:
    title: "Pro Tip"
    color: "green"
  warning:
    title: "Warning"
    color: "red"
  important:
    title: "Important"
    color: "yellow"

footer_content: "Copyright &copy; 2026 Decnet Games. All rights reserved. PERCH is a commercial Unity Asset."
